server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: car-rental-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
